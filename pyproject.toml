[project]
name = "roboegg-scara"
version = "1.0.0"
description = "SCARA 2R robotic arm control system for geometric figure tracing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
scara-studio = "src.gui.studio_pro:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
